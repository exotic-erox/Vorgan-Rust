[package]
name = "vorgan"
version = "0.2.1"
edition = "2021"
rust-version = "1.86"
description = "Terminal file manager with a particle-graph navigator (Rust port of vorgan)"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
